```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Правильное дыхание</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

/* видео */
#bg-video {
  position: fixed;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
  filter: blur(3px);
  opacity: 0.6;
}

body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(15,27,45,0.7);
  z-index: -1;
}

/* контейнер */
.container {
  text-align: center;
  width: 100%;
  max-width: 360px;
}

/* цикл (теперь сверху и заметный) */
.cycle-counter {
  color: #ffffff;
  font-size: 18px;
  margin-bottom: 10px;
  opacity: 0.9;
}

/* режимы */
.mode-buttons {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.mode-buttons button {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: 1px solid #4a90d9;
  background: transparent;
  color: #a8c5e8;
  cursor: pointer;
}

.mode-buttons button.active {
  background: #4a90d9;
  color: white;
}

/* круг */
.circle {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: #1a3a5c;
  border: 3px solid #4a90d9;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0 auto 24px;
  transition: transform 4s ease-in-out;
}

.countdown {
  color: white;
  font-size: 52px;
}

.phase-text {
  color: #a8c5e8;
}

/* кнопка */
.start-btn {
  background: #4a90d9;
  color: white;
  border: none;
  padding: 14px 40px;
  border-radius: 30px;
  font-size: 17px;
  cursor: pointer;
}

/* музыка */
#music-fab {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #4a90d9;
  color: white;
  font-size: 24px;
  border: none;
}

#music-fab.off {
  background: #555;
}
</style>
</head>

<body>

<video autoplay muted loop id="bg-video">
  <source src="bg.mp4" type="video/mp4">
</video>

<div class="container">

  <div class="cycle-counter" id="cycle-counter">ЦИКЛ: 0</div>

  <div class="mode-buttons">
    <button data-mode="478">😴 4-7-8</button>
    <button data-mode="box" class="active">🧘 Box</button>
    <button data-mode="classic">🌿 Классика</button>
  </div>

  <div class="circle" id="circle">
    <div>
      <div class="countdown" id="countdown">4</div>
      <div class="phase-text" id="phase-text">Вдох</div>
    </div>
  </div>

  <button class="start-btn" id="start-btn">Начать</button>
</div>

<button id="music-fab" class="off">🎧</button>

<script>
// элементы
const circle = document.getElementById('circle');
const countdown = document.getElementById('countdown');
const phaseText = document.getElementById('phase-text');
const btn = document.getElementById('start-btn');
const cycleCounter = document.getElementById('cycle-counter');

// режимы
let currentMode = 'box';
const modeButtons = document.querySelectorAll('.mode-buttons button');

modeButtons.forEach(b => {
  b.addEventListener('click', () => {
    currentMode = b.dataset.mode;
    modeButtons.forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    if (timer) reset();
  });
});

// техники
const techniques = {
  '478': [
    { name: 'Вдох', duration: 4 },
    { name: 'Задержка', duration: 7 },
    { name: 'Выдох', duration: 8 },
  ],
  'box': [
    { name: 'Вдох', duration: 4 },
    { name: 'Задержка', duration: 4 },
    { name: 'Выдох', duration: 4 },
    { name: 'Пауза', duration: 4 },
  ],
  'classic': [
    { name: 'Вдох', duration: 4 },
    { name: 'Задержка', duration: 4 },
    { name: 'Выдох', duration: 6 },
  ],
};

function getPhases() {
  return techniques[currentMode];
}

// звук
let audioCtx;
function tone(freq, dur) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g);
  g.connect(audioCtx.destination);
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.3, audioCtx.currentTime);
  o.start();
  o.stop(audioCtx.currentTime + dur);
}

function playSound(name) {
  if (name === 'Вдох') tone(528, 0.3);
  if (name === 'Выдох') tone(264, 0.5);
  if (name === 'Задержка') tone(396, 0.3);
  if (name === 'Пауза') tone(396, 0.3);
}

// логика
let currentPhase = 0;
let timer = null;
let countdownTimer = null;
let cycle = 0;

function startCountdown(sec) {
  let t = sec;
  countdown.textContent = t;
  countdownTimer = setInterval(() => {
    t--;
    countdown.textContent = t;
    if (t <= 0) clearInterval(countdownTimer);
  }, 1000);
}

function nextPhase() {
  const phase = getPhases()[currentPhase];

  phaseText.textContent = phase.name;
  playSound(phase.name);

  if (phase.name === 'Вдох') {
    circle.style.transform = 'scale(1.4)';
  } else {
    circle.style.transform = 'scale(1)';
  }

  startCountdown(phase.duration);

  timer = setTimeout(() => {
    currentPhase = (currentPhase + 1) % getPhases().length;

    if (currentPhase === 0) {
      cycle++;
      cycleCounter.textContent = `ЦИКЛ: ${cycle}`;
    }

    nextPhase();
  }, phase.duration * 1000);
}

function reset() {
  clearTimeout(timer);
  clearInterval(countdownTimer);
  timer = null;
  currentPhase = 0;
  cycle = 0;
  cycleCounter.textContent = 'ЦИКЛ: 0';
  btn.textContent = 'Начать';
}

// старт
btn.addEventListener('click', () => {
  if (timer) {
    reset();
  } else {
    btn.textContent = 'Стоп';
    nextPhase();
  }
});

// музыка
const music = new Audio('music.mp3');
music.loop = true;
music.volume = 0.3;
let musicEnabled = false;

const musicBtn = document.getElementById('music-fab');

musicBtn.onclick = () => {
  musicEnabled = !musicEnabled;
  if (musicEnabled) {
    music.play();
    musicBtn.classList.remove('off');
  } else {
    music.pause();
    musicBtn.classList.add('off');
  }
};
</script>

</body>
</html>
